<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Section labels -->
  <text x="20" y="22" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.5">TREE TRAVERSAL</text>
  <text x="500" y="22" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.5">BREADCRUMB STACK</text>

  <!-- Off-path edges -->
  <g fill="none" stroke="#cbd5e1" stroke-width="1.25" marker-end="url(#arr)">
    <path d="M 230 80 L 350 130"/>
    <path d="M 350 180 L 300 230"/>
    <path d="M 350 180 L 400 230"/>
    <path d="M 110 180 L 60 230"/>
  </g>

  <!-- On-path edges (Root -> I1 -> L2) -->
  <g fill="none" stroke="#6366f1" stroke-width="2.25" marker-end="url(#arr-path)">
    <path d="M 230 80 L 110 130"/>
    <path d="M 110 180 L 160 230"/>
  </g>

  <!-- Off-path nodes -->
  <g filter="url(#shadow)">
    <rect x="310" y="130" width="80" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="20"  y="230" width="80" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="260" y="230" width="80" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="360" y="230" width="80" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94a3b8">
    <text x="350" y="160">Internal</text>
    <text x="60"  y="258">leaf</text>
    <text x="300" y="258">leaf</text>
    <text x="400" y="258">leaf</text>
  </g>

  <!-- On-path nodes -->
  <g filter="url(#shadow)">
    <rect x="190" y="30"  width="80" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.75"/>
    <rect x="70"  y="130" width="80" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.75"/>
    <rect x="120" y="230" width="80" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.75"/>
  </g>
  <text x="230" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="1.5">ROOT</text>
  <text x="110" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="1.5">INTERNAL A</text>
  <text x="160" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1.5">LEAF</text>
  <text x="160" y="268" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">insert here</text>

  <!-- Step labels along the path -->
  <g font-size="11" font-weight="700" fill="#ea580c">
    <circle cx="170" cy="105" r="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
    <text x="170" y="109" text-anchor="middle">1</text>
    <circle cx="135" cy="205" r="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
    <text x="135" y="209" text-anchor="middle">2</text>
  </g>

  <!-- Stack container -->
  <g filter="url(#shadow)">
    <rect x="500" y="60" width="280" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Stack frames (top is Internal A, bottom is Root) -->
  <g filter="url(#shadow)">
    <rect x="520" y="92"  width="240" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="520" y="160" width="240" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <text x="640" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="1.5">INTERNAL A</text>
  <text x="640" y="131" text-anchor="middle" font-size="10" font-style="italic" fill="#6366f1">top of stack</text>

  <text x="640" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="1.5">ROOT</text>
  <text x="640" y="199" text-anchor="middle" font-size="10" font-style="italic" fill="#6366f1">bottom</text>

  <!-- Step badges next to stack frames -->
  <g font-size="11" font-weight="700" fill="#ea580c">
    <circle cx="500" cy="117" r="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
    <text x="500" y="121" text-anchor="middle">2</text>
    <circle cx="500" cy="185" r="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
    <text x="500" y="189" text-anchor="middle">1</text>
  </g>

  <!-- Pop arrow (after split, walk up) -->
  <g fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-push)">
    <path d="M 760 250 C 770 230, 770 130, 760 110"/>
  </g>
  <text x="700" y="280" font-size="11" font-style="italic" fill="#c2410c">pop on the way back up</text>

  <!-- Caption -->
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">
    Push each internal node visited on the way down. After the leaf insert, pop to find the parent for splits.
  </text>
</svg>
