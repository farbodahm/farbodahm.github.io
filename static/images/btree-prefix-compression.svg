<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">PREFIX COMPRESSION</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#94a3b8" font-style="italic">each row stores only the chars that differ from the previous key</text>

  <!-- Column headers -->
  <g font-size="10" fill="#94a3b8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="200" y="84">0</text>
    <text x="240" y="84">1</text>
    <text x="280" y="84">2</text>
    <text x="320" y="84">3</text>
    <text x="360" y="84">4</text>
    <text x="400" y="84">5</text>
    <text x="440" y="84">6</text>
    <text x="480" y="84">7</text>
    <text x="520" y="84">8</text>
  </g>
  <text x="80" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">KEY</text>
  <text x="660" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">STORED AS</text>

  <!-- Helper grid: a cell is 36x32 centered at column x and row y -->
  <!-- Row 1: user:1001 (all indigo, full storage) -->
  <text x="80" y="120" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">user:1001</text>
  <g filter="url(#shadow)">
    <rect x="182" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="222" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="262" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="302" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="342" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="382" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="422" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="462" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="502" y="100" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b" text-anchor="middle">
    <text x="200" y="121">u</text>
    <text x="240" y="121">s</text>
    <text x="280" y="121">e</text>
    <text x="320" y="121">r</text>
    <text x="360" y="121">:</text>
    <text x="400" y="121">1</text>
    <text x="440" y="121">0</text>
    <text x="480" y="121">0</text>
    <text x="520" y="121">1</text>
  </g>
  <text x="660" y="121" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f46e5">"user:1001"</text>

  <!-- Row 2: user:1002 (chars 0-7 shared, char 8 stored) -->
  <text x="80" y="170" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">user:1002</text>
  <g>
    <rect x="182" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="222" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="262" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="302" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="342" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="382" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="422" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="462" y="150" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="502" y="150" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="171">u</text>
    <text x="240" y="171">s</text>
    <text x="280" y="171">e</text>
    <text x="320" y="171">r</text>
    <text x="360" y="171">:</text>
    <text x="400" y="171">1</text>
    <text x="440" y="171">0</text>
    <text x="480" y="171">0</text>
  </g>
  <text x="520" y="171" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">2</text>
  <text x="660" y="171" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f46e5">(8, "2")</text>

  <!-- Row 3: user:1003 (chars 0-7 shared, char 8 stored) -->
  <text x="80" y="220" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">user:1003</text>
  <g>
    <rect x="182" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="222" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="262" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="302" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="342" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="382" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="422" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="462" y="200" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="502" y="200" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="221">u</text>
    <text x="240" y="221">s</text>
    <text x="280" y="221">e</text>
    <text x="320" y="221">r</text>
    <text x="360" y="221">:</text>
    <text x="400" y="221">1</text>
    <text x="440" y="221">0</text>
    <text x="480" y="221">0</text>
  </g>
  <text x="520" y="221" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">3</text>
  <text x="660" y="221" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f46e5">(8, "3")</text>

  <!-- Row 4: user:1234 (chars 0-5 shared, chars 6-8 stored) -->
  <text x="80" y="270" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">user:1234</text>
  <g>
    <rect x="182" y="250" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="222" y="250" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="262" y="250" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="302" y="250" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="342" y="250" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="382" y="250" width="36" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="422" y="250" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="462" y="250" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="502" y="250" width="36" height="32" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="271">u</text>
    <text x="240" y="271">s</text>
    <text x="280" y="271">e</text>
    <text x="320" y="271">r</text>
    <text x="360" y="271">:</text>
    <text x="400" y="271">1</text>
  </g>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b" text-anchor="middle">
    <text x="440" y="271">2</text>
    <text x="480" y="271">3</text>
    <text x="520" y="271">4</text>
  </g>
  <text x="660" y="271" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f46e5">(6, "234")</text>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <rect x="180" y="312" width="22" height="14" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="210" y="323">stored on this row</text>

    <rect x="380" y="312" width="22" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.25"/>
    <text x="410" y="323">shared prefix (free)</text>
  </g>

  <!-- Savings summary -->
  <g>
    <rect x="180" y="350" width="440" height="46" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.25"/>
    <text x="400" y="370" text-anchor="middle" font-size="12" fill="#9a3412">
      <tspan font-weight="700">total stored:</tspan>
      <tspan> 9 + 1 + 1 + 3 = </tspan>
      <tspan font-weight="700">14 chars</tspan>
      <tspan>, vs. </tspan>
      <tspan font-weight="700">36 chars</tspan>
      <tspan> uncompressed</tspan>
    </text>
    <text x="400" y="386" text-anchor="middle" font-size="11" font-style="italic" fill="#c2410c">about 60% smaller for tightly clustered keys</text>
  </g>
</svg>
