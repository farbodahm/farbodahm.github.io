<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Internal node outer container -->
  <g filter="url(#shadow)">
    <rect x="80" y="22" width="640" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <text x="100" y="42" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.5">INTERNAL NODE</text>

  <!-- Key/pointer array (grouped) -->
  <g filter="url(#shadow)">
    <rect x="100" y="58" width="420" height="80" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <line x1="240" y1="58" x2="240" y2="138" stroke="#a5b4fc" stroke-width="1"/>
  <line x1="380" y1="58" x2="380" y2="138" stroke="#a5b4fc" stroke-width="1"/>
  <text x="310" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#4f46e5" letter-spacing="1.5">(KEY, PTR) ARRAY</text>

  <g text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">
    <text x="170" y="120">10  •</text>
    <text x="310" y="120">20  •</text>
    <text x="450" y="120">30  •</text>
  </g>

  <!-- Rightmost pointer (separated) -->
  <g filter="url(#shadow)">
    <rect x="560" y="58" width="140" height="80" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  </g>
  <text x="630" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c" letter-spacing="1.5">RIGHTMOST PTR</text>
  <text x="630" y="118" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">•</text>

  <!-- Subtrees -->
  <g filter="url(#shadow)">
    <rect x="20"  y="240" width="180" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <rect x="210" y="240" width="180" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <rect x="400" y="240" width="180" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <rect x="600" y="240" width="180" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="10" font-weight="700" fill="#059669" letter-spacing="1.5">
    <text x="110" y="262">SUBTREE</text>
    <text x="300" y="262">SUBTREE</text>
    <text x="490" y="262">SUBTREE</text>
    <text x="690" y="262">SUBTREE</text>
  </g>
  <g text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">
    <text x="110" y="288">keys &lt; 10</text>
    <text x="300" y="288">10 ≤ keys &lt; 20</text>
    <text x="490" y="288">20 ≤ keys &lt; 30</text>
    <text x="690" y="288">keys ≥ 30</text>
  </g>

  <!-- Arrows from each pointer to its subtree -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M 170 138 C 170 190, 140 210, 110 240"/>
    <path d="M 310 138 C 310 200, 300 220, 300 240"/>
    <path d="M 450 138 C 450 200, 480 220, 490 240"/>
    <path d="M 630 138 C 630 200, 670 220, 690 240"/>
  </g>

  <!-- Caption -->
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">
    The (key, ptr) pairs sit in a clean array; the rightmost pointer lives in its own field.
  </text>
</svg>
