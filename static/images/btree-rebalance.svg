<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-rotate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- ============== BEFORE ============== -->
  <text x="190" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.5">BEFORE</text>
  <text x="190" y="52" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">child is underfull</text>

  <!-- Parent -->
  <g filter="url(#shadow)">
    <rect x="140" y="80" width="100" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="190" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">PARENT</text>
  <text x="190" y="124" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">
    <tspan fill="#6366f1" font-weight="700">20</tspan>
  </text>

  <!-- Edges -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M 170 134 L 100 220"/>
    <path d="M 210 134 L 280 220"/>
  </g>

  <!-- Child (underfull) -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="120" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.75" stroke-dasharray="5 3"/>
  </g>
  <text x="100" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c" letter-spacing="1.5">CHILD</text>
  <text x="100" y="263" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">10</text>
  <text x="100" y="290" text-anchor="middle" font-size="10" font-style="italic" fill="#dc2626">underfull</text>

  <!-- Sibling (full) -->
  <g filter="url(#shadow)">
    <rect x="220" y="220" width="160" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="300" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#059669" letter-spacing="1.5">RIGHT SIBLING</text>
  <text x="300" y="263" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">
    <tspan fill="#ea580c" font-weight="700">25</tspan>, 30, 35
  </text>
  <text x="300" y="290" text-anchor="middle" font-size="10" font-style="italic" fill="#10b981">has spare keys</text>

  <!-- Rotation arrows (key flow) -->
  <g fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-rotate)" stroke-dasharray="0">
    <!-- 20 from parent down into child -->
    <path d="M 184 134 C 160 160, 130 200, 116 218"/>
  </g>
  <text x="118" y="178" font-size="10" font-weight="700" fill="#6366f1">20 ↓</text>

  <g fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-rotate)" style="--c:#ea580c">
  </g>
  <g fill="none" stroke="#ea580c" stroke-width="2">
    <defs>
      <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
      </marker>
    </defs>
    <path d="M 268 218 C 250 200, 220 160, 200 134" marker-end="url(#arr-orange)"/>
  </g>
  <text x="240" y="178" font-size="10" font-weight="700" fill="#ea580c">25 ↑</text>

  <!-- Big rotate arrow between BEFORE and AFTER -->
  <g>
    <path d="M 400 200 L 440 200" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <text x="420" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">ROTATE</text>
  </g>

  <!-- ============== AFTER ============== -->
  <text x="630" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.5">AFTER</text>
  <text x="630" y="52" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">borrowed from sibling</text>

  <!-- Parent -->
  <g filter="url(#shadow)">
    <rect x="580" y="80" width="100" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="630" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">PARENT</text>
  <text x="630" y="124" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">
    <tspan fill="#ea580c" font-weight="700">25</tspan>
  </text>

  <!-- Edges -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M 610 134 L 540 220"/>
    <path d="M 650 134 L 720 220"/>
  </g>

  <!-- Child (now ok) -->
  <g filter="url(#shadow)">
    <rect x="480" y="220" width="120" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="540" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#059669" letter-spacing="1.5">CHILD</text>
  <text x="540" y="263" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">
    10, <tspan fill="#6366f1" font-weight="700">20</tspan>
  </text>
  <text x="540" y="290" text-anchor="middle" font-size="10" font-style="italic" fill="#10b981">at min keys</text>

  <!-- Sibling (lost first key) -->
  <g filter="url(#shadow)">
    <rect x="660" y="220" width="120" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="720" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#059669" letter-spacing="1.5">RIGHT SIBLING</text>
  <text x="720" y="263" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e293b">30, 35</text>
  <text x="720" y="290" text-anchor="middle" font-size="10" font-style="italic" fill="#10b981">still ok</text>

  <!-- Caption -->
  <g font-size="12" fill="#475569">
    <text x="400" y="346" text-anchor="middle">
      <tspan fill="#6366f1" font-weight="700">20</tspan>
      <tspan> drops from parent to child; </tspan>
      <tspan fill="#ea580c" font-weight="700">25</tspan>
      <tspan> lifts from sibling to parent.</tspan>
    </text>
    <text x="400" y="368" text-anchor="middle" font-style="italic">If neither sibling has a spare key, the underfull node merges with one instead.</text>
  </g>
</svg>
